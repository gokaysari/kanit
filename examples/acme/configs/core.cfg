!
hostname core
!
interface GigabitEthernet0/0
 description TO-EDGE
 ip address 10.0.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description USERS
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description SERVERS
 ip address 10.20.20.1 255.255.255.0
 ip access-group SERVERS-OUT out
 no shutdown
!
ip access-list extended SERVERS-OUT
 permit tcp 10.10.10.0 0.0.0.255 host 10.20.20.10 eq 443
 permit tcp 10.10.10.0 0.0.0.255 host 10.20.20.20 eq 22
 permit tcp 10.10.10.0 0.0.0.255 host 10.20.20.30 eq 5432
 deny ip any any
!
ip route 0.0.0.0 0.0.0.0 10.0.0.1
!
end
