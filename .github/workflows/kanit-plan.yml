# İstekten değişiklik üreten akış: PR'a `/kanit plan <istek>` yorumu yazılınca çalışır.
# Claude değişikliği önerir, Batfish doğrular, rapor (öneri farkıyla) PR yorumuna düşer.
# Öneri dala yazılmaz; uygulanırsa kanit-pr iş akışı onu hedef dala karşı yeniden doğrular.
#
# Güvenlik:
# - issue_comment iş akışı her zaman varsayılan daldaki bu dosyayla çalışır; PR bu dosyayı
#   değiştirerek kendini tetikleyemez. Araç da varsayılan daldan kurulur; PR'dan yalnızca
#   snapshot dosyaları veri olarak okunur.
# - Yalnızca repo sahibi, üye ya da iş birlikçisinin yorumu tetikler.
# - Fork PR'larında sır kullanan adıma gelinmeden iş durur.
name: kanit-plan

on:
  issue_comment:
    types: [created]

permissions: {}

env:
  SNAPSHOT: examples/acme

jobs:
  plan:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/kanit plan ') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    services:
      batfish:
        image: batfish/allinone
        ports:
          - 9996:9996
    steps:
      - name: PR'ın kaynağını denetle (fork ise dur)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          set -euo pipefail
          gh api "$PR_URL" > "$RUNNER_TEMP/pr.json"
          head_repo="$(jq -r .head.repo.full_name "$RUNNER_TEMP/pr.json")"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Fork PR'ı ($head_repo): sır gerektiren plan akışı çalıştırılmaz."
            exit 1
          fi
          echo "head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: .kanit-pr
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -q .

      - name: Batfish hazır olana kadar bekle
        run: |
          for i in $(seq 1 60); do
            python -c "from pybatfish.client.session import Session; Session(host='localhost')" 2>/dev/null && exit 0
            sleep 5
          done
          exit 1

      - name: Değişikliği üret ve doğrula
        id: plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BATFISH_HOST: localhost
          COMMENT: ${{ github.event.comment.body }}
        run: |
          first="$(printf '%s\n' "$COMMENT" | head -n1 | tr -d '\r')"
          intent="${first#/kanit plan }"
          # Değişmezler PR'dan değil varsayılan daldan: PR policy.json'u gevşetemesin.
          if [ -f "$SNAPSHOT/policy.json" ]; then
            cp "$SNAPSHOT/policy.json" ".kanit-pr/$SNAPSHOT/policy.json"
          fi
          set +e
          kanit plan "$intent" --snapshot ".kanit-pr/$SNAPSHOT" --out kanit-plan.md 2>&1 | tee kanit-plan.log
          echo "exit-code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Raporu PR yorumu olarak yaz
        if: always() && steps.pr.outputs.head_sha
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          python .github/actions/kanit-check/post_comment.py kanit-plan.md \
            --pr "$PR_NUMBER" --marker kanit-plan --log kanit-plan.log

      - name: Sonuç
        if: always()
        env:
          CODE: ${{ steps.plan.outputs.exit-code }}
        run: exit "${CODE:-2}"
