name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      batfish:
        image: batfish/allinone
        ports:
          - 9996:9996
    env:
      BATFISH_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Batfish hazır olana kadar bekle
        run: |
          for i in $(seq 1 60); do
            python -c "from pybatfish.client.session import Session; Session(host='localhost')" && exit 0
            sleep 5
          done
          exit 1
      - run: pytest -v -s
      - name: Demo raporu üret
        run: |
          kanit plan "Kullanıcı ağından veritabanı sunucusuna (10.20.20.30) tcp/5432 aç" \
            --snapshot examples/acme \
            --scripted examples/acme/scripted/01-fazla-genis.json examples/acme/scripted/02-dogru.json
          cat kanit-rapor.md >> "$GITHUB_STEP_SUMMARY"
